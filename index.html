<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Analyzer</title>
    <!-- Runs before the page paints, so a dark-mode user never sees a white flash -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("sa:theme"));
        if (t === "dark" || t === "light")
          document.documentElement.dataset.theme = t;
        else if (matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">
      <h1 class="logo">Stock Analyzer</h1>
      <div class="header-tools">
        <form class="search" role="search" id="search-form">
          <label for="symbol" class="visually-hidden"
            >Search stocks by company name or symbol</label
          >
          <input
            id="symbol"
            type="search"
            placeholder="Search e.g. Zomato, Tata, INFY"
            autocomplete="off"
          />
          <button type="submit">Search</button>
          <ul
            id="suggestions"
            class="suggestions"
            aria-label="Search suggestions"
            hidden
          ></ul>
        </form>
        <button
          type="button"
          id="theme-toggle"
          class="theme-toggle"
          aria-pressed="false"
        >
          Dark mode
        </button>
      </div>
    </header>

    <div class="strip">
      <div id="indices" class="indices"></div>
      <p id="status" class="status" role="status"></p>
    </div>

    <main class="layout" id="main">
      <section class="card summary" id="summary" aria-live="polite"></section>

      <section class="card chart" aria-labelledby="chart-title">
        <h2 id="chart-title">Price history (daily close)</h2>
        <div
          class="timeframes"
          id="timeframes"
          role="group"
          aria-label="Time range"
        >
          <button type="button" data-range="5d">1W</button>
          <button type="button" data-range="1mo" class="active">1M</button>
          <button type="button" data-range="6mo">6M</button>
          <button type="button" data-range="1y">1Y</button>
        </div>
        <div class="chart-box">
          <canvas
            id="price-chart"
            role="img"
            aria-label="Price history chart"
          ></canvas>
          <p id="chart-msg" class="chart-msg" role="status"></p>
        </div>
        <div id="analysis" class="analysis"></div>
      </section>

      <aside class="card watchlist" aria-labelledby="watch-title">
        <div class="card-head">
          <h2 id="watch-title">My Watchlist</h2>
          <button type="button" id="reset-watchlist" class="link-btn">
            Reset
          </button>
        </div>
        <div
          class="sort-bar"
          id="sort-bar"
          role="group"
          aria-label="Sort stocks"
        >
          <button type="button" class="sort-btn" data-sort="symbol">
            Name
          </button>
          <button type="button" class="sort-btn" data-sort="price">
            Price
          </button>
          <button type="button" class="sort-btn" data-sort="changePct">
            % Change
          </button>
        </div>
        <ul id="stock-list"></ul>
      </aside>
    </main>

    <footer class="site-footer">
      For educational purposes only. Not financial advice.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
