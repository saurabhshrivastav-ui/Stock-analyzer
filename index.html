<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="logo">Stock Analyzer</h1>
    <form class="search" role="search">
      <label for="symbol" class="visually-hidden">Stock symbol</label>
      <input id="symbol" type="search" placeholder="Search a symbol, e.g. AAPL">
      <button type="submit">Search</button>
    </form>
  </header>

  <main class="layout">

    <!-- Summary card -->
    <section class="card summary" aria-labelledby="summary-title">
      <h2 id="summary-title">Apple Inc. <span class="ticker">AAPL</span></h2>
      <p class="price">$189.84</p>
      <p class="change gain">+1.27 (+0.67%)</p>
      <dl class="stats">
        <div><dt>Open</dt><dd>$188.10</dd></div>
        <div><dt>High</dt><dd>$190.40</dd></div>
        <div><dt>Low</dt><dd>$187.55</dd></div>
        <div><dt>Volume</dt><dd>52.3M</dd></div>
      </dl>
    </section>

    <!-- Chart placeholder (Chart.js goes here in Stage 4) -->
    <section class="card chart" aria-labelledby="chart-title">
      <h2 id="chart-title">Price history</h2>
      <div class="timeframes">
        <button type="button">1W</button>
        <button type="button" class="active">1M</button>
        <button type="button">6M</button>
        <button type="button">1Y</button>
      </div>
      <div class="chart-placeholder">Chart coming in Stage 4</div>
    </section>

    <!-- Watchlist -->
    <aside class="card watchlist" aria-labelledby="watch-title">
      <h2 id="watch-title">Watchlist</h2>
      <ul>
        <li><span>MSFT</span><span>$415.20</span><span class="gain">+0.8%</span></li>
        <li><span>TSLA</span><span>$242.64</span><span class="loss">-1.9%</span></li>
        <li><span>GOOGL</span><span>$140.93</span><span class="gain">+0.3%</span></li>
        <li><span>AMZN</span><span>$178.15</span><span class="loss">-0.4%</span></li>
      </ul>
    </aside>

  </main>

  <footer class="site-footer">
    For educational purposes only. Not financial advice.
  </footer>

</body>
</html>
