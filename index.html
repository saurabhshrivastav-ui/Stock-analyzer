<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Analyzer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="logo">Stock Analyzer</h1>
      <form class="search" role="search" id="search-form">
        <label for="symbol" class="visually-hidden">Search stocks</label>
        <input
          id="symbol"
          type="search"
          placeholder="Filter, or type an NSE symbol e.g. ZOMATO"
          autocomplete="off"
        />
        <button type="submit">Search</button>
      </form>
    </header>

    <div class="strip">
      <div id="indices" class="indices"></div>
      <p id="status" class="status" role="status"></p>
    </div>

    <main class="layout">
      <section class="card summary" id="summary" aria-live="polite"></section>

      <section class="card chart" aria-labelledby="chart-title">
        <h2 id="chart-title">Price history (daily close)</h2>
        <div class="timeframes" id="timeframes">
          <button type="button" data-range="5d">1W</button>
          <button type="button" data-range="1mo" class="active">1M</button>
          <button type="button" data-range="6mo">6M</button>
          <button type="button" data-range="1y">1Y</button>
        </div>
        <div class="chart-box">
          <canvas
            id="price-chart"
            aria-label="Price history chart"
            role="img"
          ></canvas>
          <p id="chart-msg" class="chart-msg" role="status"></p>
        </div>
        <div id="analysis" class="analysis"></div>
      </section>

      <aside class="card watchlist" aria-labelledby="watch-title">
        <h2 id="watch-title">NSE Stocks</h2>
        <div class="sort-bar" id="sort-bar">
          <button type="button" class="sort-btn" data-sort="symbol">
            Name
          </button>
          <button type="button" class="sort-btn" data-sort="price">
            Price
          </button>
          <button type="button" class="sort-btn" data-sort="changePct">
            % Change
          </button>
        </div>
        <ul id="stock-list"></ul>
      </aside>
    </main>

    <footer class="site-footer">
      For educational purposes only. Not financial advice.
    </footer>

    <!-- Chart.js from CDN (pinned version). Plain script, loads before our module. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
