<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="logo">Stock Analyzer</h1>
    <form class="search" role="search" id="search-form">
      <label for="symbol" class="visually-hidden">Search stocks</label>
      <input id="symbol" type="search" placeholder="Filter by name or symbol" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </header>

  <main class="layout">

    <!-- Filled by ui.js -->
    <section class="card summary" id="summary" aria-live="polite"></section>

    <section class="card chart" aria-labelledby="chart-title">
      <h2 id="chart-title">Price history</h2>
      <div class="timeframes">
        <button type="button">1W</button>
        <button type="button" class="active">1M</button>
        <button type="button">6M</button>
        <button type="button">1Y</button>
      </div>
      <div class="chart-placeholder">Chart coming in Stage 4</div>
    </section>

    <aside class="card watchlist" aria-labelledby="watch-title">
      <h2 id="watch-title">Stocks</h2>
      <div class="sort-bar" id="sort-bar">
        <button type="button" class="sort-btn" data-sort="symbol">Name</button>
        <button type="button" class="sort-btn" data-sort="price">Price</button>
        <button type="button" class="sort-btn" data-sort="changePct">% Change</button>
      </div>
      <ul id="stock-list"></ul>
    </aside>

  </main>

  <footer class="site-footer">
    For educational purposes only. Not financial advice.
  </footer>

  <!-- type="module" lets us use import/export between files -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
